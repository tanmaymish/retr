name: Deploy web app

on:
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/deploy.yml"
  workflow_dispatch: {}
  workflow_run:
    workflows: ["AI pipeline"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # A snapshot of the 8-page website (before the full feature-parity
      # expansion) is kept live at /v1/ alongside the current site, at the
      # user's request — nothing on main was reverted for this. Uses a
      # worktree off the already-checked-out history rather than a second
      # network checkout.
      - name: Checkout v1 snapshot into a worktree
        run: git worktree add old-version 5e350fa

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Install
        working-directory: app
        run: npm ci

      - name: Build
        working-directory: app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
        run: npm run build

      - name: Install (v1 snapshot)
        working-directory: old-version/app
        run: npm ci

      - name: Build (v1 snapshot)
        working-directory: old-version/app
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/v1/
        run: npm run build

      - name: Merge v1 snapshot into dist
        run: |
          mkdir -p app/dist/v1
          cp -r old-version/app/dist/. app/dist/v1/

      - name: SPA fallback for deep links
        run: |
          cp app/dist/index.html app/dist/404.html
          cp app/dist/v1/index.html app/dist/v1/404.html

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: app/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
