name: AI pipeline

# Regenerates the AI-authored screen content (advisor co-pilot briefing, fit-score
# explanations, FAQ answers) via GitHub Models — a free-tier, OpenAI-compatible
# inference API scoped to this repo's own GITHUB_TOKEN. No external API key needed:
# the `permissions: models: read` block below is what unlocks the call.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ai/**"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: write
  models: read

concurrency:
  group: ai-pipeline
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI content pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o-mini' }}
        run: node ai/run-all.mjs

      - name: Commit generated content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add app/src/data/ai/*.json
          if git diff --cached --quiet; then
            echo "No content changes."
          else
            git commit -m "chore: refresh AI-generated screen content"
            git push
          fi
