name: AI pipeline

# Regenerates the AI-authored screen content (advisor co-pilot briefing, fit-score
# explanations, FAQ answers) via GitHub Models — a free-tier, OpenAI-compatible
# inference API scoped to this repo's own GITHUB_TOKEN. No external API key needed:
# the `permissions: models: read` block below is what unlocks the call.
on:
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "ai/**"
  schedule:
    - cron: "0 3 * * 1" # weekly, Monday 03:00 UTC

permissions:
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: ai-pipeline
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run AI content pipeline
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AI_MODEL: ${{ vars.AI_MODEL || 'openai/gpt-4o-mini' }}
        run: node ai/run-all.mjs

      # Machine-written words on a regulated firm's site are reviewed before
      # they are published, not after. This used to commit straight to main on a
      # schedule, which meant copy nobody had read could reach the public site
      # at 03:00 on a Monday. It opens a pull request instead: the same content,
      # the same automation, with a person between it and the site.
      #
      # `gh` is on the runner already, so this needs no third-party action and
      # no token beyond the one the job is granted above.
      - name: Propose the generated content
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # `git add` on a pathspec that matches nothing exits 128, and under
          # `set -e` that would fail the job on the most ordinary outcome there
          # is: the generators wrote nothing. The directory is created by them
          # at runtime, so its absence is a normal state, not an error.
          if [ -d app/src/data/ai ]; then
            git add -A app/src/data/ai
          fi

          if git diff --cached --quiet; then
            echo "No content changes; nothing to propose."
            exit 0
          fi

          branch="ai-content/$(date -u +%Y%m%d-%H%M%S)"
          git checkout -b "$branch"
          git commit -m "Refresh the AI-generated screen content"
          git push -u origin "$branch"

          gh pr create \
            --base main \
            --head "$branch" \
            --title "Refresh the AI-generated screen content" \
            --body "$(cat <<'BODY'
          Generated by the scheduled AI pipeline (`.github/workflows/ai-pipeline.yml`).

          These are machine-written words that will appear on a site published by
          an IRDAI-registered Insurance Marketing Firm. Read them before merging —
          in particular check that nothing here states a figure, a guarantee, a
          client outcome or a regulatory claim that has not been verified.

          The usual checks run on this pull request like any other.
          BODY
          )"
