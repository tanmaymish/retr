name: Verify

# The single definition of "this revision is good".
#
# There is exactly one of these, called from two places: `ci.yml` runs it on
# every pull request and branch push, and `pages.yml` runs it before it is
# allowed to publish. That is the point of it being reusable — "verified" means
# the same thing on a pull request as it does on the deploy, so a change cannot
# be green in review and unchecked at release.
#
# Nothing here needs a secret, so it is safe on a pull request from a fork.

on:
  workflow_call: {}

permissions:
  contents: read

# This repository is a single npm workspace. Installing from the root lockfile
# is the only correct way to install it: running `npm ci` inside app/ or server/
# still resolves the workspace root above them, so a per-directory install would
# read the root lockfile anyway and fail the moment the two disagree.
jobs:
  quality:
    name: Lint, tests and dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Lint the client
        run: npm run lint

      - name: Server tests
        run: npm test

      # A known-vulnerable dependency in an advisory firm's stack is a finding
      # waiting to be written up, so it fails the build rather than printing a
      # warning nobody reads. High and critical only: moderate advisories in
      # build-time tooling would block releases without reducing any risk a
      # visitor is exposed to.
      - name: Audit dependencies
        run: npm audit --audit-level=high

  browser:
    name: Drive the built site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install workspaces
        run: npm ci

      - name: Install a browser
        working-directory: app
        run: npx playwright install --with-deps chromium

      # The bundle that goes to a static host. Everything is compiled in, so
      # every page must stand up on its own.
      - name: Build the static bundle
        env:
          VITE_STATIC: 'true'
        run: npm run build

      - name: Click the static site
        run: npm --prefix app run smoke

      # The bundle the server hands out. Two pages fetch from the API rather
      # than from the bundle, and with no API running they correctly show a
      # waiting state — SMOKE_SERVED says so, rather than the script guessing.
      - name: Build the server's bundle
        run: npm run build

      - name: Click the served site
        env:
          SMOKE_SERVED: '1'
        run: npm --prefix app run smoke

  image:
    name: The image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
