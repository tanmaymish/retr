[build]
  command = "VITE_BASE=/ npm run build"
  publish = "app/dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "22"

[functions]
  node_bundler = "esbuild"

# Direct all /api requests to Netlify serverless function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

# SPA routing: redirect all requests to index.html unless a static file matches
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
